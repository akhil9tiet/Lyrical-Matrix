    <style>
      body {
        background-color: #F5F5F5; /* Light Base */
        color: #334155; /* Slate-700 */
        overflow-x: hidden;
      }

      html {
        overflow-x: clip;
      }

      /* Enhanced Neumorphic/Claymorphism Utilities */
      .clay-card {
        background-color: #F5F5F5;
        border-radius: 40px;
        box-shadow: 
          16px 16px 32px #bebebe, 
          -16px -16px 32px #ffffff,
          inset 1px 1px 2px rgba(255,255,255,0.8);
        border: 1px solid rgba(0,0,0,0.03);
        position: relative;
        overflow: hidden;
        transition: box-shadow 150ms ease, border-color 150ms ease;
      }

      .clay-inset {
        background-color: #F5F5F5;
        border-radius: 20px;
        box-shadow: 
          inset 8px 8px 16px #d9d9d9, 
          inset -8px -8px 16px #ffffff;
        border: none;
        color: #334155;
        transition: all 0.3s ease;
      }
      
      .clay-inset:focus {
        box-shadow: 
          inset 4px 4px 8px #d9d9d9, 
          inset -4px -4px 8px #ffffff;
        outline: none;
      }

      .clay-button {
        background-color: #F5F5F5;
        color: #6366f1; /* Indigo-500 */
        border-radius: 18px;
        box-shadow: 
          8px 8px 16px #bebebe, 
          -8px -8px 16px #ffffff;
        transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        font-weight: 800;
        border: 1px solid rgba(255,255,255,0.3);
      }

      .clay-button:hover:not(:disabled) {
        color: #4f46e5;
        box-shadow: 
          4px 4px 8px #bebebe, 
          -4px -4px 8px #ffffff;
        transform: translateY(-2px);
      }

      .clay-button:active:not(:disabled) {
        box-shadow: 
          inset 4px 4px 8px #bebebe, 
          inset -4px -4px 8px #ffffff;
        transform: translateY(0);
      }

      .clay-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: none;
        background-color: #e5e5e5;
      }

      /* Custom Reveal Animation */
      @keyframes reveal-card {
        0% {
          opacity: 0;
          transform: translateX(100px) scale(0.3);
        }
        70% {
          opacity: 1;
          transform: translateX(0) scale(1.2);
        }
        100% {
          opacity: 1;
          transform: translateX(0) scale(1.0);
        }
      }

      .animate-reveal-card {
        animation: reveal-card 1s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
      }

      /* Zoom container for infinite canvas effect */
      .zoom-container {
        transform-origin: center top;
        will-change: transform;
      }

      .zoom-container.zoom-transition {
        transition: transform 900ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Full-dashboard beat-reactive glow */
      #beat-glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 30;
        opacity: 0;
        will-change: opacity;
        background:
          radial-gradient(55% 45% at var(--glow-x, 50%) var(--glow-y, 50%), rgba(244, 114, 182, 0.5), rgba(244, 114, 182, 0) 72%),
          radial-gradient(85% 65% at var(--glow-x, 50%) var(--glow-y, 50%), rgba(99, 102, 241, 0.32), rgba(99, 102, 241, 0) 72%);
      }

      /* Custom scrollbar for light mode */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #F5F5F5; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 5px;
        border: 2px solid #F5F5F5;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }

      /* Static SEO content */
      .seo-hero {
        text-align: center;
        padding: 2rem 1rem 1rem;
      }
      .seo-hero h1 {
        font-size: 2.25rem;
        line-height: 1.15;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: #334155;
        text-shadow: 0 1px 2px rgba(51, 65, 85, 0.15);
        margin: 0 0 0.75rem;
      }
      .seo-hero .accent { color: #6366f1; }
      @media (min-width: 768px) {
        .seo-hero h1 { font-size: 3.75rem; }
      }
      .seo-hero .tagline {
        font-size: 0.875rem;
        line-height: 1.375;
        color: #64748b;
        max-width: 32rem;
        margin: 0 auto;

      }
